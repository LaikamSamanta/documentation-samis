      html: '<div class="dsacc"><div class="dsacc-item"><button class="dsacc-head">Kas ir WordPress? <span class="dsacc-icon">+</span></button><div class="dsacc-body"><p>WordPress ir satura pārvaldības sistēma (CMS), kas darbina vairāk nekā 40% no visām interneta vietnēm.</p></div></div><div class="dsacc-item"><button class="dsacc-head">Vai der iesācējiem? <span class="dsacc-icon">+</span></button><div class="dsacc-body"><p>Jā - pamata lietošanai nav vajadzīgas programmēšanas zināšanas, bet pielāgošanai der zināt HTML/CSS/PHP.</p></div></div><div class="dsacc-item"><button class="dsacc-head">Cik tas maksā? <span class="dsacc-icon">+</span></button><div class="dsacc-body"><p>Pats WordPress ir bezmaksas - maksā tikai domēns un hostings.</p></div></div></div>',

      html: '<div class="dstabs"><div class="dstabs-nav"><button class="dstabs-btn active" data-tab="t1">Apraksts</button><button class="dstabs-btn" data-tab="t2">Specifikācija</button><button class="dstabs-btn" data-tab="t3">Atsauksmes</button></div><div class="dstabs-panel active" id="t1"><p>Produkta apraksts šeit...</p></div><div class="dstabs-panel" id="t2"><p>Tehniskā specifikācija šeit...</p></div><div class="dstabs-panel" id="t3"><p>Klientu atsauksmes šeit...</p></div></div>',

      html: '<button id="openModalBtn" class="dsmodal-open-btn">Atvērt modālo logu</button><div class="dsmodal-overlay" id="myModal"><div class="dsmodal-box"><button class="dsmodal-close" aria-label="Aizvērt">&#10005;</button><div class="dsmodal-icon"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .962 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"/></svg></div><h3>Modālā loga virsraksts</h3><p>Šeit ir modālā loga saturs. Klikšķini ārpusē vai uz &#10005;, lai aizvērtu.</p></div></div>',

    'preview-toast': {
      css: '.dstoast-btn { background: linear-gradient(135deg,#059669,#10b981); color: #fff; border: none; padding: 12px 24px; border-radius: 12px; cursor: pointer; font-weight: 600; font-size: .9rem; box-shadow: 0 10px 24px -10px rgba(5,150,105,.5); transition: transform .2s ease, box-shadow .2s ease; } .dstoast-btn:hover { transform: translateY(-2px); box-shadow: 0 14px 28px -10px rgba(5,150,105,.6); } .dstoast-wrap { position: fixed; bottom: 20px; right: 20px; display: flex; flex-direction: column; gap: 10px; z-index: 999; } .dstoast { background: #111827; color: #fff; padding: 15px 20px 15px 22px; border-radius: 14px; box-shadow: 0 20px 45px -15px rgba(0,0,0,.45); opacity: 0; transform: translateX(20px) scale(.95); transition: opacity .3s ease, transform .3s cubic-bezier(.34,1.56,.64,1); font-size: .85rem; display: flex; align-items: center; gap: 12px; min-width: 220px; position: relative; overflow: hidden; } .dstoast.show { opacity: 1; transform: translateX(0) scale(1); } .dstoast::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: linear-gradient(180deg,#10b981,#34d399); } .dstoast-icon { width: 22px; height: 22px; border-radius: 50%; background: linear-gradient(135deg,#10b981,#34d399); display: flex; align-items: center; justify-content: center; font-size: .65rem; flex-shrink: 0; box-shadow: 0 0 0 4px rgba(16,185,129,.15); } .dstoast-bar { position: absolute; bottom: 0; left: 0; height: 3px; background: linear-gradient(90deg,#10b981,#34d399); animation: dstoastShrink 3s linear forwards; } @keyframes dstoastShrink { from { width: 100%; } to { width: 0%; } }',

      js: "var thumbs=Array.prototype.slice.call(document.querySelectorAll('.dslb-thumb'));var overlay=document.getElementById('lbOverlay');var lbImg=document.getElementById('lbImage');var current=0;function openAt(i){current=i;lbImg.src=thumbs[i].dataset.full||thumbs[i].src;lbImg.alt=thumbs[i].alt;overlay.classList.add('open');}function next(){openAt((current+1)%thumbs.length);}function prev(){openAt((current-1+thumbs.length)%thumbs.length);}thumbs.forEach(function(thumb,i){thumb.addEventListener('click',function(){openAt(i);});});document.getElementById('lbClose').addEventListener('click',function(){overlay.classList.remove('open');});document.getElementById('lbNext').addEventListener('click',next);document.getElementById('lbPrev').addEventListener('click',prev);overlay.addEventListener('click',function(e){if(e.target===overlay)overlay.classList.remove('open');});document.addEventListener('keydown',function(e){if(!overlay.classList.contains('open'))return;if(e.key==='Escape')overlay.classList.remove('open');if(e.key==='ArrowRight')next();if(e.key==='ArrowLeft')prev();});"

    'preview-authcard': {
      css: '.dsauth-wrap { position: relative; padding: 30px; } .dsauth-wrap::before, .dsauth-wrap::after { content: ""; position: absolute; width: 220px; height: 220px; border-radius: 50%; filter: blur(60px); opacity: .35; z-index: -1; animation: dsauthFloat 8s ease-in-out infinite; } .dsauth-wrap::before { background: #4f46e5; top: -40px; left: -40px; } .dsauth-wrap::after { background: #3b82f6; bottom: -40px; right: -40px; animation-delay: -4s; } @keyframes dsauthFloat { 0%, 100% { transform: translate(0,0) scale(1); } 50% { transform: translate(20px,-20px) scale(1.15); } } .dsauth-card { position: relative; overflow: hidden; width: 100%; max-width: 600px; aspect-ratio: 3/2; margin: 0 auto; border-radius: 28px; background: #fff; box-shadow: 0 30px 60px -25px rgba(49,46,129,.35), 0 10px 20px -10px rgba(0,0,0,.15); } .dsauth-form { position: absolute; top: 0; width: 50%; height: 100%; box-sizing: border-box; display: flex; flex-direction: column; justify-content: center; gap: 12px; padding: 0 36px; } .dsauth-form--login { left: 0; } .dsauth-form--register { left: 50%; } .dsauth-form h4 { margin: 0; font-size: 1.4rem; font-weight: 700; color: #1e293b; letter-spacing: -.01em; } .dsauth-sub { margin: -4px 0 6px; color: #6b7280; font-size: .85rem; } .dsauth-form input { width: 100%; box-sizing: border-box; padding: 12px 14px; border-radius: 12px; border: 1.5px solid #e5e7eb; font: inherit; transition: border-color .2s ease, box-shadow .2s ease; } .dsauth-form input:focus { outline: none; border-color: #6366f1; box-shadow: 0 0 0 4px rgba(168,85,247,.15); } .dsauth-submit-btn { padding: 12px; margin-top: 4px; border-radius: 12px; border: none; background: linear-gradient(135deg, #4f46e5, #3b82f6); color: #fff; font-weight: 600; font-size: .95rem; cursor: pointer; box-shadow: 0 10px 24px -10px rgba(79,70,229,.6); transition: transform .2s ease, box-shadow .2s ease; } .dsauth-submit-btn:hover { transform: translateY(-2px); box-shadow: 0 14px 28px -10px rgba(79,70,229,.7); } .dsauth-cover { position: absolute; top: 8px; bottom: 8px; left: 8px; width: calc(50% - 16px); border-radius: 20px; overflow: hidden; z-index: 2; transition: transform .65s cubic-bezier(.65,0,.35,1); } .dsauth-card.view-login .dsauth-cover { transform: translateX(calc(100% + 16px)); } .dsauth-card.view-register .dsauth-cover { transform: translateX(0); } .dsauth-cover-bg { position: absolute; inset: 0; background-size: cover; background-position: center; opacity: 0; transform: scale(1.08); transition: opacity .7s ease, transform 1.4s ease; } .dsauth-card.view-login .dsauth-cover-bg--login { opacity: 1; transform: scale(1); } .dsauth-card.view-register .dsauth-cover-bg--register { opacity: 1; transform: scale(1); } .dsauth-cover::after { content: ""; position: absolute; inset: 0; background: linear-gradient(190deg, rgba(20,10,45,.1) 10%, rgba(12,6,28,.7) 100%); } .dsauth-hero { position: absolute; inset: 0; z-index: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 0 28px; text-align: center; color: #fff; opacity: 0; pointer-events: none; transition: opacity .5s ease; } .dsauth-hero h3 { margin: 0; font-size: 1.4rem; } .dsauth-hero p { margin: 0; opacity: .9; font-size: .875rem; line-height: 1.5; } .dsauth-toggle-btn { padding: 11px 30px; border-radius: 100px; border: 1.5px solid rgba(255,255,255,.7); background: rgba(255,255,255,.08); backdrop-filter: blur(6px); color: #fff; font-weight: 600; letter-spacing: .02em; cursor: pointer; transition: .25s ease; } .dsauth-toggle-btn:hover { background: #fff; color: #1e293b; border-color: #fff; transform: translateY(-2px); box-shadow: 0 10px 24px -8px rgba(0,0,0,.35); } .dsauth-card.view-login .dsauth-hero--login { opacity: 1; pointer-events: auto; } .dsauth-card.view-register .dsauth-hero--register { opacity: 1; pointer-events: auto; }',
      html: '<div class="dsauth-wrap"><div class="dsauth-card view-login" id="dsauth1"><form class="dsauth-form dsauth-form--login"><h4>Pieteikšanās</h4><p class="dsauth-sub">Priecājamies redzēt tevi atkal!</p><input type="email" placeholder="E-pasts"><input type="password" placeholder="Parole"><button type="submit" class="dsauth-submit-btn">Pieteikties</button></form><form class="dsauth-form dsauth-form--register"><h4>Reģistrācija</h4><p class="dsauth-sub">Izveido kontu dažu sekunžu laikā</p><input type="text" placeholder="Vārds"><input type="email" placeholder="E-pasts"><input type="password" placeholder="Parole"><button type="submit" class="dsauth-submit-btn">Reģistrēties</button></form><div class="dsauth-cover"><div class="dsauth-cover-bg dsauth-cover-bg--login" style="background-image:url(' + img1 + ')"></div><div class="dsauth-cover-bg dsauth-cover-bg--register" style="background-image:url(' + img5 + ')"></div><div class="dsauth-hero dsauth-hero--login"><h3>Sveiks!</h3><p>Vēl nav konta? Pievienojies mums.</p><button type="button" class="dsauth-toggle-btn" data-target="register">Reģistrēties</button></div><div class="dsauth-hero dsauth-hero--register"><h3>Laipni lūdzam atpakaļ</h3><p>Jau esi reģistrējies? Piesakies.</p><button type="button" class="dsauth-toggle-btn" data-target="login">Pieteikties</button></div></div></div></div>',
      js: "(function(){var card=document.getElementById('dsauth1');card.querySelectorAll('.dsauth-toggle-btn').forEach(function(btn){btn.addEventListener('click',function(){card.classList.remove('view-login','view-register');card.classList.add('view-'+btn.dataset.target);});});card.querySelectorAll('.dsauth-form').forEach(function(form){form.addEventListener('submit',function(e){e.preventDefault();});});})();"
    },
    'preview-pricing': {
      css: '.dsprice-toggle { display: flex; align-items: center; justify-content: center; gap: 14px; margin-bottom: 24px; font-size: .875rem; color: #6b7280; font-weight: 600; } .dsprice-save { color: #059669; font-weight: 700; } .dsprice-switch { position: relative; width: 46px; height: 26px; border-radius: 100px; background: #e5e7eb; border: none; cursor: pointer; transition: background .25s ease; padding: 0; } .dsprice-switch.on { background: linear-gradient(135deg,#4f46e5,#3b82f6); } .dsprice-switch-thumb { position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,.25); transition: transform .25s cubic-bezier(.65,0,.35,1); } .dsprice-switch.on .dsprice-switch-thumb { transform: translateX(20px); } .dspricing { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; align-items: center; } .dsprice-card { position: relative; background: #fff; border: 1.5px solid #eef0f4; border-radius: 20px; padding: 26px 20px; text-align: left; transition: transform .3s ease, box-shadow .3s ease; } .dsprice-card:hover { transform: translateY(-4px); box-shadow: 0 20px 45px -20px rgba(0,0,0,.2); } .dsprice-card--featured { border: 2px solid transparent; background: linear-gradient(#fff,#fff) padding-box, linear-gradient(135deg,#4f46e5,#3b82f6) border-box; transform: scale(1.05); box-shadow: 0 25px 60px -20px rgba(79,70,229,.4); z-index: 1; transition: transform .1s ease-out, box-shadow .3s ease; } .dsprice-card--featured:hover { box-shadow: 0 30px 70px -18px rgba(79,70,229,.5); } .dsprice-badge { position: absolute; top: -13px; left: 50%; transform: translateX(-50%); background: linear-gradient(135deg,#4f46e5,#3b82f6); color: #fff; font-size: .65rem; font-weight: 700; letter-spacing: .03em; text-transform: uppercase; padding: 5px 14px; border-radius: 100px; box-shadow: 0 8px 16px -6px rgba(79,70,229,.5); white-space: nowrap; } .dsprice-card h3 { margin: 0 0 6px; font-size: 1rem; color: #6b7280; font-weight: 600; } .dsprice-amount { margin: 0 0 8px; display: flex; align-items: baseline; gap: 4px; } .dsprice-num { font-size: 1.8rem; font-weight: 800; color: #1e293b; } .dsprice-period { color: #9ca3af; font-size: .75rem; } .dsprice-desc { margin: 0 0 16px; color: #6b7280; font-size: .78rem; line-height: 1.5; } .dsprice-features { list-style: none; margin: 0 0 20px; padding: 0; display: flex; flex-direction: column; gap: 8px; } .dsprice-features li { display: flex; align-items: center; gap: 8px; font-size: .78rem; color: #374151; } .dsprice-features li::before { content: "✓"; width: 18px; height: 18px; border-radius: 50%; background: #eef2ff; color: #4f46e5; font-size: .6rem; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; } .dsprice-btn { width: 100%; padding: 10px; border-radius: 10px; border: 1.5px solid #e5e7eb; background: #fff; color: #1e293b; font-weight: 600; font-size: .82rem; cursor: pointer; transition: .2s ease; } .dsprice-btn:hover { border-color: #6366f1; color: #4f46e5; } .dsprice-btn--featured { background: linear-gradient(135deg,#4f46e5,#3b82f6); border: none; color: #fff; box-shadow: 0 10px 24px -10px rgba(79,70,229,.6); } .dsprice-btn--featured:hover { transform: translateY(-2px); }',
      html: '<div class="dsprice-toggle"><span>Mēnesī</span><button class="dsprice-switch" id="pricingSwitch" role="switch" aria-checked="false"><span class="dsprice-switch-thumb"></span></button><span>Gadā <span class="dsprice-save">(ietaupi 20%)</span></span></div><div class="dspricing"><div class="dsprice-card"><h3>Starter</h3><p class="dsprice-amount"><span class="dsprice-num" data-monthly="9" data-yearly="7">€9</span><span class="dsprice-period">/mēnesī</span></p><p class="dsprice-desc">Priekš neliela projekta sākumam.</p><ul class="dsprice-features"><li>1 lietotājs</li><li>5 GB krātuve</li><li>E-pasta atbalsts</li></ul><button class="dsprice-btn">Izvēlēties</button></div><div class="dsprice-card dsprice-card--featured"><span class="dsprice-badge">Populārākais</span><h3>Pro</h3><p class="dsprice-amount"><span class="dsprice-num" data-monthly="29" data-yearly="23">€29</span><span class="dsprice-period">/mēnesī</span></p><p class="dsprice-desc">Augošām komandām ar lielākām vajadzībām.</p><ul class="dsprice-features"><li>10 lietotāji</li><li>100 GB krātuve</li><li>Prioritārs atbalsts</li><li>API pieeja</li></ul><button class="dsprice-btn dsprice-btn--featured">Izvēlēties</button></div><div class="dsprice-card"><h3>Enterprise</h3><p class="dsprice-amount"><span class="dsprice-num" data-monthly="99" data-yearly="79">€99</span><span class="dsprice-period">/mēnesī</span></p><p class="dsprice-desc">Neierobežotai mērogošanai un drošībai.</p><ul class="dsprice-features"><li>Neierobežoti lietotāji</li><li>1 TB krātuve</li><li>Dedicēts menedžeris</li></ul><button class="dsprice-btn">Izvēlēties</button></div></div>',
      js: "(function(){var toggle=document.getElementById('pricingSwitch');var nums=document.querySelectorAll('.dsprice-num');var periods=document.querySelectorAll('.dsprice-period');var yearly=false;toggle.addEventListener('click',function(){yearly=!yearly;toggle.classList.toggle('on',yearly);toggle.setAttribute('aria-checked',String(yearly));nums.forEach(function(el){el.textContent='€'+(yearly?el.dataset.yearly:el.dataset.monthly);});periods.forEach(function(el){el.textContent=yearly?'/mēnesī, rēķins gadā':'/mēnesī';});});var featured=document.querySelector('.dsprice-card--featured');featured.addEventListener('mousemove',function(e){var rect=featured.getBoundingClientRect();var x=(e.clientX-rect.left)/rect.width-0.5;var y=(e.clientY-rect.top)/rect.height-0.5;featured.style.transform='perspective(1000px) rotateY('+(x*12)+'deg) rotateX('+(-y*12)+'deg) scale(1.05)';});featured.addEventListener('mouseleave',function(){featured.style.transform='';});})();"
    },
    'preview-stats': {
      css: '.dsstats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; text-align: center; padding: 12px 0; } .dsstat-num { margin: 0; font-size: 2rem; font-weight: 800; background: linear-gradient(135deg,#4f46e5,#3b82f6); -webkit-background-clip: text; background-clip: text; color: transparent; } .dsstat-num.done { animation: dsstatGlow 1s ease-out; } @keyframes dsstatGlow { 0% { filter: drop-shadow(0 0 0 rgba(79,70,229,0)); } 40% { filter: drop-shadow(0 0 14px rgba(79,70,229,.5)); } 100% { filter: drop-shadow(0 0 0 rgba(79,70,229,0)); } } .dsstat-label { margin: 6px 0 0; color: #6b7280; font-size: .72rem; font-weight: 600; letter-spacing: .01em; }',
      html: '<div class="dsstats"><div class="dsstat"><p class="dsstat-num" data-target="500" data-suffix="+">0</p><p class="dsstat-label">Apmierināti klienti</p></div><div class="dsstat"><p class="dsstat-num" data-target="98" data-suffix="%">0</p><p class="dsstat-label">Uzticības rādītājs</p></div><div class="dsstat"><p class="dsstat-num" data-target="24" data-suffix="/7">0</p><p class="dsstat-label">Klientu atbalsts</p></div><div class="dsstat"><p class="dsstat-num" data-target="12" data-suffix="k+">0</p><p class="dsstat-label">Pabeigti projekti</p></div></div>',
      js: "(function(){var nums=document.querySelectorAll('.dsstat-num');function animateNum(el){var target=parseFloat(el.dataset.target);var suffix=el.dataset.suffix||'';var duration=1400;var start=performance.now();function tick(now){var progress=Math.min((now-start)/duration,1);var eased=1-Math.pow(1-progress,3);el.textContent=Math.round(target*eased)+suffix;if(progress<1){requestAnimationFrame(tick);}else{el.classList.add('done');}}requestAnimationFrame(tick);}var observer=new IntersectionObserver(function(entries){entries.forEach(function(entry){if(entry.isIntersecting){animateNum(entry.target);observer.unobserve(entry.target);}});},{threshold:0.5});nums.forEach(function(num){observer.observe(num);});})();"
    },
    'preview-testimonials': {
      css: '.dstest { max-width: 100%; margin: 0 auto; background: rgba(255,255,255,.7); backdrop-filter: blur(20px) saturate(180%); border: 1px solid rgba(255,255,255,.6); border-radius: 22px; padding: 28px 26px; box-shadow: 0 25px 60px -25px rgba(49,46,129,.3), 0 10px 20px -10px rgba(0,0,0,.1), inset 0 1px 0 rgba(255,255,255,.9); overflow: hidden; box-sizing: border-box; } .dstest-track { display: flex; transition: transform .5s cubic-bezier(.65,0,.35,1), height .3s ease; } .dstest-slide { flex: 0 0 100%; text-align: center; box-sizing: border-box; padding: 0 6px; } .dstest-stars { color: #f59e0b; letter-spacing: 2px; margin-bottom: 12px; font-size: .95rem; } .dstest-quote { font-size: .95rem; line-height: 1.6; color: #1e293b; margin: 0 0 18px; font-weight: 500; } .dstest-author { display: flex; align-items: center; justify-content: center; gap: 12px; } .dstest-avatar { width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(135deg,#4f46e5,#3b82f6); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: .78rem; flex-shrink: 0; animation: dstestAvatarGlow 2.5s ease-in-out infinite; } @keyframes dstestAvatarGlow { 0%, 100% { box-shadow: 0 0 0 0 rgba(79,70,229,.35); } 50% { box-shadow: 0 0 0 7px rgba(79,70,229,.06); } } .dstest-author div { text-align: left; font-size: .82rem; } .dstest-author strong { display: block; color: #1e293b; } .dstest-author span { color: #9ca3af; } .dstest-nav { display: flex; align-items: center; justify-content: center; gap: 16px; margin-top: 22px; } .dstest-btn { width: 34px; height: 34px; border-radius: 50%; border: 1.5px solid #e5e7eb; background: #fff; color: #6b7280; cursor: pointer; font-size: 1.1rem; display: flex; align-items: center; justify-content: center; transition: .2s ease; } .dstest-btn:hover { border-color: #6366f1; color: #4f46e5; } .dstest-dots { display: flex; gap: 6px; } .dstest-dots button { width: 7px; height: 7px; border-radius: 100px; border: none; background: #e5e7eb; cursor: pointer; padding: 0; transition: width .3s ease, background .3s ease; } .dstest-dots button.active { width: 20px; background: linear-gradient(135deg,#4f46e5,#3b82f6); }',
      html: '<div class="dstest" id="dstest1"><div class="dstest-track"><div class="dstest-slide"><div class="dstest-stars">★★★★★</div><p class="dstest-quote">"Šis rīks ietaupīja mums neskaitāmas stundas katru nedēļu. Ieviešana bija pārsteidzoši vienkārša."</p><div class="dstest-author"><span class="dstest-avatar">LK</span><div><strong>Laura Kalniņa</strong><span>Mārketinga vadītāja</span></div></div></div><div class="dstest-slide"><div class="dstest-stars">★★★★★</div><p class="dstest-quote">"Klientu atbalsts ir nevainojams - atbild dažu minūšu laikā un patiešām palīdz, nevis tikai lasa skriptu."</p><div class="dstest-author"><span class="dstest-avatar">MO</span><div><strong>Mārtiņš Ozols</strong><span>Produkta vadītājs</span></div></div></div><div class="dstest-slide"><div class="dstest-stars">★★★★☆</div><p class="dstest-quote">"Cena/kvalitāte attiecība ir izcila. Vienīgais mīnuss - gribētos vēl vairāk integrāciju, bet tās nāk klāt regulāri."</p><div class="dstest-author"><span class="dstest-avatar">SB</span><div><strong>Sanita Bērziņa</strong><span>Uzņēmuma īpašniece</span></div></div></div></div><div class="dstest-nav"><button class="dstest-btn" id="dstestPrev" aria-label="Iepriekšējā atsauksme">‹</button><div class="dstest-dots"></div><button class="dstest-btn" id="dstestNext" aria-label="Nākamā atsauksme">›</button></div></div>',
      js: "(function(){var card=document.getElementById('dstest1');var track=card.querySelector('.dstest-track');var slides=card.querySelectorAll('.dstest-slide');var dotsWrap=card.querySelector('.dstest-dots');var index=0;slides.forEach(function(_,i){var dot=document.createElement('button');if(i===0)dot.classList.add('active');dot.addEventListener('click',function(){goTo(i);});dotsWrap.appendChild(dot);});var dots=dotsWrap.querySelectorAll('button');function setHeight(){track.style.height=slides[index].offsetHeight+'px';}function goTo(i){index=(i+slides.length)%slides.length;track.style.transform='translateX(-'+(index*100)+'%)';dots.forEach(function(d,di){d.classList.toggle('active',di===index);});setHeight();}window.addEventListener('resize',setHeight);setHeight();card.querySelector('#dstestPrev').addEventListener('click',function(){goTo(index-1);});card.querySelector('#dstestNext').addEventListener('click',function(){goTo(index+1);});})();"
    },
    'preview-upload': {
      css: '.dsupload-zone { display: block; border: 2px dashed #c7d2fe; border-radius: 18px; padding: 32px 20px; text-align: center; cursor: pointer; transition: border-color .2s ease, background .3s ease, box-shadow .3s ease; background: linear-gradient(120deg, #eff6ff 30%, #dbeafe 50%, #eff6ff 70%); background-size: 200% 100%; animation: dsuploadShimmer 4s ease-in-out infinite; } @keyframes dsuploadShimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } } .dsupload-zone:hover, .dsupload-zone.dragover { border-color: #6366f1; background: #eef2ff; animation: none; box-shadow: 0 0 0 6px rgba(99,102,241,.12); } .dsupload-icon { width: 44px; height: 44px; margin: 0 auto 12px; border-radius: 50%; background: linear-gradient(135deg,#4f46e5,#3b82f6); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; } .dsupload-title { margin: 0 0 4px; font-weight: 700; color: #1e293b; font-size: .9rem; } .dsupload-sub { margin: 0; color: #9ca3af; font-size: .78rem; } .dsupload-browse { color: #4f46e5; font-weight: 600; text-decoration: underline; } .dsupload-list { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; } .dsupload-file { display: flex; align-items: center; gap: 12px; background: #fff; border: 1px solid #eef0f4; border-radius: 12px; padding: 12px 14px; } .dsupload-file-icon { width: 34px; height: 34px; border-radius: 9px; background: #eef2ff; color: #4f46e5; display: flex; align-items: center; justify-content: center; font-size: .8rem; font-weight: 700; flex-shrink: 0; } .dsupload-file-info { flex: 1; min-width: 0; } .dsupload-file-name { margin: 0; font-size: .8rem; font-weight: 600; color: #1e293b; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .dsupload-file-bar { height: 4px; border-radius: 100px; background: #f3f4f6; margin-top: 6px; overflow: hidden; } .dsupload-file-bar-fill { height: 100%; background: linear-gradient(90deg,#4f46e5,#3b82f6); width: 0%; transition: width .4s ease; } .dsupload-file-remove { background: none; border: none; color: #9ca3af; cursor: pointer; font-size: 1rem; padding: 4px; line-height: 1; flex-shrink: 0; } .dsupload-file-remove:hover { color: #ef4444; }',
      html: '<div class="dsupload" id="dsupload1"><label class="dsupload-zone" for="dsupload-input"><input type="file" id="dsupload-input" multiple hidden><div class="dsupload-icon">⬆</div><p class="dsupload-title">Ievelc failus šeit</p><p class="dsupload-sub">vai <span class="dsupload-browse">izvēlies no ierīces</span> - PNG, JPG, PDF līdz 10 MB</p></label><div class="dsupload-list" id="dsupload-list"></div></div>',
      js: "(function(){var zone=document.querySelector('.dsupload-zone');var input=document.getElementById('dsupload-input');var list=document.getElementById('dsupload-list');function addFile(file){var item=document.createElement('div');item.className='dsupload-file';item.innerHTML='<span class=\"dsupload-file-icon\">'+file.name.split('.').pop().slice(0,3).toUpperCase()+'</span><div class=\"dsupload-file-info\"><p class=\"dsupload-file-name\">'+file.name+'</p><div class=\"dsupload-file-bar\"><div class=\"dsupload-file-bar-fill\"></div></div></div><button class=\"dsupload-file-remove\" aria-label=\"Noņemt\">✕</button>';list.appendChild(item);var fill=item.querySelector('.dsupload-file-bar-fill');requestAnimationFrame(function(){fill.style.width='100%';});item.querySelector('.dsupload-file-remove').addEventListener('click',function(){item.remove();});}function handleFiles(files){Array.prototype.slice.call(files).forEach(addFile);}zone.addEventListener('dragover',function(e){e.preventDefault();zone.classList.add('dragover');});zone.addEventListener('dragleave',function(){zone.classList.remove('dragover');});zone.addEventListener('drop',function(e){e.preventDefault();zone.classList.remove('dragover');handleFiles(e.dataTransfer.files);});input.addEventListener('change',function(){handleFiles(input.files);});})();"
    },
    'preview-search': {
      css: '.dssearch { position: relative; max-width: 340px; margin: 0 auto; } .dssearch-box { position: relative; display: flex; align-items: center; } .dssearch-icon { position: absolute; left: 14px; width: 18px; height: 18px; color: #9ca3af; pointer-events: none; } .dssearch-input { width: 100%; box-sizing: border-box; padding: 12px 14px 12px 42px; border-radius: 12px; border: 1.5px solid #e5e7eb; font: inherit; font-size: .88rem; transition: border-color .25s ease, box-shadow .25s ease, transform .25s ease; } .dssearch-input:focus { outline: none; border-color: #6366f1; box-shadow: 0 0 0 4px #eef2ff, 0 12px 30px -12px rgba(79,70,229,.35); transform: translateY(-1px); } .dssearch-results { list-style: none; margin: 8px 0 0; padding: 6px; position: absolute; top: 100%; left: 0; right: 0; background: rgba(255,255,255,.85); backdrop-filter: blur(16px) saturate(180%); border-radius: 14px; border: 1px solid rgba(255,255,255,.6); box-shadow: 0 20px 45px -20px rgba(49,46,129,.3); max-height: 220px; overflow-y: auto; display: none; z-index: 10; } .dssearch-results.open { display: block; } .dssearch-item { display: flex; flex-direction: column; gap: 2px; padding: 10px 12px; border-radius: 9px; cursor: pointer; } .dssearch-item:hover, .dssearch-item.active { background: #eef2ff; } .dssearch-item-title { font-size: .82rem; font-weight: 600; color: #1e293b; } .dssearch-item-title mark { background: #c7d2fe; color: #4338ca; border-radius: 3px; padding: 0 1px; } .dssearch-item-cat { font-size: .7rem; color: #9ca3af; } .dssearch-empty { padding: 16px; text-align: center; color: #9ca3af; font-size: .82rem; }',
      html: '<div class="dssearch" id="dssearch1"><div class="dssearch-box"><svg class="dssearch-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg><input type="text" class="dssearch-input" id="dssearchInput" placeholder="Meklēt lapas..." autocomplete="off"></div><ul class="dssearch-results" id="dssearchResults"></ul></div>',
      js: "(function(){var items=[{title:'WordPress hooks un filtri',cat:'WordPress'},{title:'REST API autentifikācija',cat:'API'},{title:'CSS Grid padziļināti',cat:'HTML & CSS'},{title:'SQL Injection aizsardzība',cat:'Drošība'},{title:'Git zaru pārvaldība',cat:'Git & GitHub'},{title:'JavaScript Promises',cat:'JavaScript'},{title:'Core Web Vitals mērīšana',cat:'SEO'}];var input=document.getElementById('dssearchInput');var list=document.getElementById('dssearchResults');var activeIndex=-1;function highlight(text,query){var i=text.toLowerCase().indexOf(query.toLowerCase());if(i===-1)return text;return text.slice(0,i)+'<mark>'+text.slice(i,i+query.length)+'</mark>'+text.slice(i+query.length);}function render(query){var matches=items.filter(function(item){return item.title.toLowerCase().indexOf(query.toLowerCase())>-1;});activeIndex=-1;if(!query){list.classList.remove('open');list.innerHTML='';return;}list.innerHTML=matches.length?matches.map(function(item){return '<li class=\"dssearch-item\"><span class=\"dssearch-item-title\">'+highlight(item.title,query)+'</span><span class=\"dssearch-item-cat\">'+item.cat+'</span></li>';}).join(''):'<li class=\"dssearch-empty\">Nekas netika atrasts</li>';list.classList.add('open');}input.addEventListener('input',function(){render(input.value.trim());});input.addEventListener('keydown',function(e){var options=list.querySelectorAll('.dssearch-item');if(!options.length)return;if(e.key==='ArrowDown'){e.preventDefault();activeIndex=(activeIndex+1)%options.length;}else if(e.key==='ArrowUp'){e.preventDefault();activeIndex=(activeIndex-1+options.length)%options.length;}else if(e.key==='Enter'&&activeIndex>-1){options[activeIndex].click();return;}else if(e.key==='Escape'){list.classList.remove('open');return;}else{return;}Array.prototype.forEach.call(options,function(opt,i){opt.classList.toggle('active',i===activeIndex);});});list.addEventListener('click',function(e){var item=e.target.closest('.dssearch-item');if(!item)return;input.value=item.querySelector('.dssearch-item-title').textContent;list.classList.remove('open');});document.addEventListener('click',function(e){if(!document.getElementById('dssearch1').contains(e.target)){list.classList.remove('open');}});})();"

    'preview-navbar': {
      css: '.dsnav-frame { max-width: 320px; margin: 0 auto; container-type: inline-size; border-radius: 24px; overflow: hidden; border: 1px solid #eef0f4; box-shadow: 0 25px 60px -25px rgba(49,46,129,.35), 0 10px 20px -10px rgba(0,0,0,.15); } .dsnav { position: relative; display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; background: rgba(255,255,255,.85); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(0,0,0,.06); } .dsnav-brand { font-weight: 800; font-size: 1rem; background: linear-gradient(135deg,#4f46e5,#3b82f6); -webkit-background-clip: text; background-clip: text; color: transparent; text-decoration: none; } .dsnav-toggle { display: none; flex-direction: column; justify-content: center; gap: 4px; width: 34px; height: 34px; border: none; background: #eef2ff; border-radius: 9px; cursor: pointer; flex-shrink: 0; } .dsnav-toggle span { width: 16px; height: 2px; background: #4f46e5; margin: 0 auto; border-radius: 2px; transition: transform .3s ease, opacity .3s ease; } .dsnav-toggle.open span:nth-child(1) { transform: translateY(6px) rotate(45deg); } .dsnav-toggle.open span:nth-child(2) { opacity: 0; } .dsnav-toggle.open span:nth-child(3) { transform: translateY(-6px) rotate(-45deg); } .dsnav-links { display: flex; align-items: center; gap: 18px; } .dsnav-links a { color: #475569; text-decoration: none; font-size: .82rem; font-weight: 600; white-space: nowrap; } .dsnav-links a:hover { color: #4f46e5; } .dsnav-cta { position: relative; overflow: hidden; background: linear-gradient(135deg,#4f46e5,#3b82f6); color: #fff !important; padding: 8px 14px; border-radius: 9px; } .dsnav-cta::before { content: ""; position: absolute; top: 0; left: -75%; width: 50%; height: 100%; background: linear-gradient(120deg, transparent, rgba(255,255,255,.5), transparent); transform: skewX(-20deg); transition: left .6s ease; } .dsnav-cta:hover::before { left: 125%; } .dsnav-body { padding: 20px 16px; color: #475569; font-size: .8rem; line-height: 1.6; } .dsnav-body h4 { margin: 0 0 8px; color: #1e293b; font-size: .9rem; } @container (max-width: 420px) { .dsnav-toggle { display: flex; } .dsnav-links { position: absolute; top: 100%; right: 0; width: 190px; background: #fff; flex-direction: column; align-items: flex-start; padding: 16px; gap: 12px; box-shadow: 0 20px 40px -20px rgba(0,0,0,.3); border-radius: 0 0 0 16px; transform: translateY(-8px); opacity: 0; pointer-events: none; transition: opacity .25s ease, transform .25s ease; } .dsnav-links.open { opacity: 1; transform: translateY(0); pointer-events: auto; } .dsnav-cta { width: 100%; text-align: center; box-sizing: border-box; } }',
      html: '<div class="dsnav-frame"><nav class="dsnav" id="dsnav1"><a class="dsnav-brand" href="#">Zīmols</a><button class="dsnav-toggle" id="dsnavToggle" aria-label="Izvēlne" aria-expanded="false"><span></span><span></span><span></span></button><div class="dsnav-links" id="dsnavLinks"><a href="#">Sākums</a><a href="#">Par mums</a><a href="#">Pakalpojumi</a><a href="#">Kontakti</a><a class="dsnav-cta" href="#">Pieteikties</a></div></nav><div class="dsnav-body"><h4>Konteinera vaicājums, nevis viewport</h4><p>Šis rāmis ir šaurs ar nolūku - izvēlne uz "hamburgeru" pārslēdzas balstoties uz šī konteinera platumu, nevis visa loga platumu.</p></div></div>',
      js: "(function(){var toggle=document.getElementById('dsnavToggle');var links=document.getElementById('dsnavLinks');toggle.addEventListener('click',function(){var isOpen=links.classList.toggle('open');toggle.classList.toggle('open',isOpen);toggle.setAttribute('aria-expanded',String(isOpen));});var linkEls=links.querySelectorAll('a');Array.prototype.forEach.call(linkEls,function(link){link.addEventListener('click',function(){links.classList.remove('open');toggle.classList.remove('open');toggle.setAttribute('aria-expanded','false');});});})();"

    'preview-stepper': {
      css: '.dsstep-list { display: flex; list-style: none; margin: 0 0 24px; padding: 0; } .dsstep-item { flex: 1; position: relative; display: flex; flex-direction: column; align-items: center; text-align: center; font-size: .78rem; color: #9ca3af; font-weight: 600; } .dsstep-item:not(:last-child)::after { content: ""; position: absolute; top: 17px; left: 50%; width: 100%; height: 2px; background: #e5e7eb; z-index: 0; } .dsstep-item.completed:not(:last-child)::after { background: linear-gradient(90deg,#4f46e5,#3b82f6,#4f46e5); background-size: 200% 100%; animation: dsstepShimmer 2.5s linear infinite; } @keyframes dsstepShimmer { 0% { background-position: 200% 0; } 100% { background-position: 0% 0; } } .dsstep-circle { position: relative; z-index: 1; width: 34px; height: 34px; border-radius: 50%; background: #fff; border: 2px solid #e5e7eb; display: flex; align-items: center; justify-content: center; margin-bottom: 8px; font-size: .8rem; color: #9ca3af; transition: .3s ease; } .dsstep-item.completed .dsstep-circle { background: linear-gradient(135deg,#4f46e5,#3b82f6); border-color: transparent; color: #fff; } .dsstep-item.active .dsstep-circle { border-color: #4f46e5; color: #4f46e5; box-shadow: 0 0 0 4px #eef2ff; } .dsstep-item.active .dsstep-label { color: #1e293b; } .dsstep-actions { display: flex; justify-content: space-between; gap: 12px; } .dsstep-btn { padding: 10px 22px; border-radius: 10px; border: none; background: linear-gradient(135deg,#4f46e5,#3b82f6); color: #fff; font-weight: 600; font-size: .85rem; cursor: pointer; transition: transform .2s ease; } .dsstep-btn:hover { transform: translateY(-2px); } .dsstep-btn:disabled { opacity: .4; cursor: not-allowed; transform: none; } .dsstep-btn--ghost { background: none; border: 1.5px solid #e5e7eb; color: #6b7280; }',
      html: '<div class="dsstepper" id="dsstepper1"><ol class="dsstep-list"><li class="dsstep-item" data-step="1"><span class="dsstep-circle">1</span><span class="dsstep-label">Konts</span></li><li class="dsstep-item" data-step="2"><span class="dsstep-circle">2</span><span class="dsstep-label">Piegāde</span></li><li class="dsstep-item" data-step="3"><span class="dsstep-circle">3</span><span class="dsstep-label">Maksājums</span></li><li class="dsstep-item" data-step="4"><span class="dsstep-circle">4</span><span class="dsstep-label">Apstiprinājums</span></li></ol><div class="dsstep-actions"><button class="dsstep-btn dsstep-btn--ghost" id="dsstepBack">Atpakaļ</button><button class="dsstep-btn" id="dsstepNext">Tālāk</button></div></div>',
      js: "(function(){var stepper=document.getElementById('dsstepper1');var items=stepper.querySelectorAll('.dsstep-item');var backBtn=document.getElementById('dsstepBack');var nextBtn=document.getElementById('dsstepNext');var current=2;function render(){Array.prototype.forEach.call(items,function(item){var step=Number(item.dataset.step);item.classList.remove('active','completed');if(step<current)item.classList.add('completed');if(step===current)item.classList.add('active');item.querySelector('.dsstep-circle').textContent=step<current?'✓':step;});backBtn.disabled=current===1;nextBtn.textContent=current===items.length?'Pabeigt':'Tālāk';}backBtn.addEventListener('click',function(){if(current>1)current-=1;render();});nextBtn.addEventListener('click',function(){if(current<items.length)current+=1;render();});render();})();"
    },
    'preview-compare': {
      css: '.dscompare-toggle { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; font-size: .8rem; color: #6b7280; font-weight: 600; cursor: pointer; } .dscompare { overflow-x: auto; border-radius: 16px; border: 1px solid #eef0f4; } .dscompare-table { width: 100%; border-collapse: collapse; font-size: .8rem; min-width: 420px; } .dscompare-table th, .dscompare-table td { padding: 12px 14px; text-align: center; } .dscompare-table th:first-child, .dscompare-table td:first-child { text-align: left; color: #374151; font-weight: 600; } .dscompare-table thead th { background: #f9fafb; color: #6b7280; font-size: .72rem; text-transform: uppercase; letter-spacing: .03em; border-bottom: 1px solid #eef0f4; } .dscompare-table tbody tr:not(:last-child) td { border-bottom: 1px solid #f3f4f6; } .dscompare-table tbody tr { transition: background .2s ease; } .dscompare-table tbody tr:hover td:not(.dscompare-featured) { background: rgba(99,102,241,.04); } .dscompare-featured { background: #eef2ff; box-shadow: inset 0 0 24px rgba(79,70,229,.08); position: relative; } .dscompare-table thead .dscompare-featured { background: linear-gradient(135deg,#4f46e5,#3b82f6); color: #fff; box-shadow: none; } .dscompare-check { color: #059669; font-weight: 700; } .dscompare-x { color: #d1d5db; font-weight: 700; }',
      html: '<label class="dscompare-toggle"><input type="checkbox" id="dscompareDiffToggle"> Rādīt tikai atšķirīgās rindas</label><div class="dscompare"><table class="dscompare-table"><thead><tr><th>Funkcija</th><th>Starter</th><th class="dscompare-featured">Pro</th><th>Enterprise</th></tr></thead><tbody><tr><td>Lietotāju skaits</td><td>1</td><td class="dscompare-featured">10</td><td>Neierobežoti</td></tr><tr><td>Krātuve</td><td>5 GB</td><td class="dscompare-featured">100 GB</td><td>1 TB</td></tr><tr><td>E-pasta atbalsts</td><td><span class="dscompare-check">✓</span></td><td class="dscompare-featured"><span class="dscompare-check">✓</span></td><td><span class="dscompare-check">✓</span></td></tr><tr><td>API pieeja</td><td><span class="dscompare-x">✕</span></td><td class="dscompare-featured"><span class="dscompare-check">✓</span></td><td><span class="dscompare-check">✓</span></td></tr><tr><td>Prioritārs atbalsts</td><td><span class="dscompare-x">✕</span></td><td class="dscompare-featured"><span class="dscompare-check">✓</span></td><td><span class="dscompare-check">✓</span></td></tr><tr><td>Dedicēts menedžeris</td><td><span class="dscompare-x">✕</span></td><td class="dscompare-featured"><span class="dscompare-x">✕</span></td><td><span class="dscompare-check">✓</span></td></tr></tbody></table></div>',
      js: "(function(){var table=document.querySelector('.dscompare-table');var toggle=document.getElementById('dscompareDiffToggle');var rows=table.querySelectorAll('tbody tr');toggle.addEventListener('change',function(){Array.prototype.forEach.call(rows,function(row){var cells=Array.prototype.slice.call(row.querySelectorAll('td')).slice(1);var values=cells.map(function(c){return c.textContent.trim();});var allEqual=values.every(function(v){return v===values[0];});row.style.display=(toggle.checked&&allEqual)?'none':'';});});})();"
    },
    'preview-rating': {
      css: '.dsrating { text-align: center; } .dsrating-stars { display: inline-flex; gap: 6px; } .dsrating-star { background: none; border: none; cursor: pointer; font-size: 2rem; line-height: 1; color: #e5e7eb; padding: 0; transition: color .15s ease, transform .15s ease; } .dsrating-star:hover { transform: scale(1.15); } .dsrating-star.hover, .dsrating-star.selected { color: #f59e0b; } .dsrating-star.pop { animation: dsratingPop .45s cubic-bezier(.34,1.56,.64,1); } @keyframes dsratingPop { 0% { transform: scale(1) rotate(0); } 45% { transform: scale(1.5) rotate(-10deg); } 100% { transform: scale(1) rotate(0); } } .dsrating-text { margin: 10px 0 0; color: #6b7280; font-size: .85rem; font-weight: 600; }',
      html: '<div class="dsrating" id="dsrating1"><div class="dsrating-stars" role="radiogroup" aria-label="Vērtējums"><button type="button" class="dsrating-star" data-value="1" aria-label="1 zvaigzne">★</button><button type="button" class="dsrating-star" data-value="2" aria-label="2 zvaigznes">★</button><button type="button" class="dsrating-star" data-value="3" aria-label="3 zvaigznes">★</button><button type="button" class="dsrating-star" data-value="4" aria-label="4 zvaigznes">★</button><button type="button" class="dsrating-star" data-value="5" aria-label="5 zvaigznes">★</button></div><p class="dsrating-text" id="dsratingText">Uzklikšķini, lai novērtētu</p></div>',
      js: "(function(){var rating=document.getElementById('dsrating1');var stars=rating.querySelectorAll('.dsrating-star');var text=document.getElementById('dsratingText');var labels=['','Slikti','Vidēji','Labi','Ļoti labi','Lieliski'];var selected=0;function paint(value){Array.prototype.forEach.call(stars,function(star){star.classList.toggle('hover',Number(star.dataset.value)<=value);});}Array.prototype.forEach.call(stars,function(star){star.addEventListener('mouseenter',function(){paint(Number(star.dataset.value));});star.addEventListener('click',function(){selected=Number(star.dataset.value);Array.prototype.forEach.call(stars,function(s,i){var isSelected=Number(s.dataset.value)<=selected;s.classList.toggle('selected',isSelected);if(isSelected){s.classList.remove('pop');void s.offsetWidth;s.style.animationDelay=(i*0.05)+'s';s.classList.add('pop');}});text.textContent=labels[selected]+' ('+selected+'/5)';});});rating.querySelector('.dsrating-stars').addEventListener('mouseleave',function(){paint(selected);});})();"
    },
    'preview-notif': {
      css: '.dsnotif { position: relative; display: inline-block; } .dsnotif-bell { position: relative; width: 44px; height: 44px; border-radius: 50%; border: 1.5px solid #e5e7eb; background: #fff; color: #475569; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: border-color .2s ease; } .dsnotif-bell:hover { border-color: #6366f1; color: #4f46e5; } .dsnotif-bell svg { width: 20px; height: 20px; } .dsnotif-badge { position: absolute; top: -2px; right: -2px; min-width: 18px; height: 18px; padding: 0 4px; border-radius: 100px; background: #ef4444; color: #fff; font-size: .65rem; font-weight: 700; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 2px #fff; animation: dsnotifBadgePulse 2s ease-in-out infinite; } .dsnotif-badge.empty { display: none; animation: none; } @keyframes dsnotifBadgePulse { 0%, 100% { box-shadow: 0 0 0 2px #fff, 0 0 0 2px #fff; } 50% { box-shadow: 0 0 0 2px #fff, 0 0 0 6px rgba(239,68,68,.25); } } .dsnotif-panel { position: absolute; top: calc(100% + 10px); left: 0; width: 280px; background: rgba(255,255,255,.8); backdrop-filter: blur(24px) saturate(180%); border-radius: 16px; border: 1px solid rgba(255,255,255,.6); box-shadow: 0 25px 60px -25px rgba(49,46,129,.35), 0 10px 20px -10px rgba(0,0,0,.15), inset 0 1px 0 rgba(255,255,255,.9); opacity: 0; transform: translateY(-8px) scale(.97); pointer-events: none; transition: opacity .2s ease, transform .2s ease; z-index: 10; } .dsnotif-panel.open { opacity: 1; transform: translateY(0) scale(1); pointer-events: auto; } .dsnotif-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border-bottom: 1px solid #f3f4f6; font-weight: 700; font-size: .85rem; color: #1e293b; } .dsnotif-clear { background: none; border: none; color: #4f46e5; font-size: .7rem; font-weight: 600; cursor: pointer; } .dsnotif-list { list-style: none; margin: 0; padding: 6px; max-height: 240px; overflow-y: auto; } .dsnotif-item { display: flex; gap: 10px; padding: 10px; border-radius: 10px; cursor: pointer; align-items: flex-start; } .dsnotif-item:hover { background: #f9fafb; } .dsnotif-dot { width: 8px; height: 8px; border-radius: 50%; background: #4f46e5; margin-top: 6px; flex-shrink: 0; opacity: 0; } .dsnotif-item.unread .dsnotif-dot { opacity: 1; } .dsnotif-item strong { display: block; font-size: .8rem; color: #1e293b; } .dsnotif-item p { margin: 2px 0; color: #6b7280; font-size: .76rem; line-height: 1.4; } .dsnotif-time { font-size: .66rem; color: #9ca3af; }',
      html: '<div class="dsnotif" id="dsnotif1"><button type="button" class="dsnotif-bell" id="dsnotifBell" aria-label="Paziņojumi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg><span class="dsnotif-badge" id="dsnotifBadge">3</span></button><div class="dsnotif-panel" id="dsnotifPanel"><div class="dsnotif-head"><span>Paziņojumi</span><button type="button" class="dsnotif-clear" id="dsnotifClear">Atzīmēt visus kā lasītus</button></div><ul class="dsnotif-list"><li class="dsnotif-item unread"><span class="dsnotif-dot"></span><div><strong>Jauns komentārs</strong><p>Anna atstāja komentāru zem tava raksta.</p><span class="dsnotif-time">pirms 5 min</span></div></li><li class="dsnotif-item unread"><span class="dsnotif-dot"></span><div><strong>Maksājums saņemts</strong><p>Rēķins #4821 ir apmaksāts.</p><span class="dsnotif-time">pirms 1 h</span></div></li><li class="dsnotif-item unread"><span class="dsnotif-dot"></span><div><strong>Sistēmas atjauninājums</strong><p>Plānots tehniskais darbs šonakt 02:00.</p><span class="dsnotif-time">vakar</span></div></li></ul></div></div>',
      js: "(function(){var notif=document.getElementById('dsnotif1');var bell=document.getElementById('dsnotifBell');var panel=document.getElementById('dsnotifPanel');var badge=document.getElementById('dsnotifBadge');var clearBtn=document.getElementById('dsnotifClear');var items=notif.querySelectorAll('.dsnotif-item');function updateBadge(){var count=notif.querySelectorAll('.dsnotif-item.unread').length;badge.textContent=count;badge.classList.toggle('empty',count===0);}bell.addEventListener('click',function(e){e.stopPropagation();panel.classList.toggle('open');});Array.prototype.forEach.call(items,function(item){item.addEventListener('click',function(){item.classList.remove('unread');updateBadge();});});clearBtn.addEventListener('click',function(){Array.prototype.forEach.call(items,function(item){item.classList.remove('unread');});updateBadge();});document.addEventListener('click',function(e){if(!notif.contains(e.target))panel.classList.remove('open');});updateBadge();})();"
    },
    'preview-timeline': {
      css: '.dstimeline { list-style: none; margin: 0; padding: 0; } .dstimeline-item { position: relative; padding: 0 0 24px 30px; opacity: 0; transform: translateY(16px); transition: opacity .5s ease, transform .5s ease; } .dstimeline-item.visible { opacity: 1; transform: translateY(0); } .dstimeline-item:last-child { padding-bottom: 0; } .dstimeline-item::before { content: ""; position: absolute; left: 5px; top: 18px; bottom: -8px; width: 2px; background: #e5e7eb; } .dstimeline-item:last-child::before { display: none; } .dstimeline-dot { position: absolute; left: 0; top: 4px; width: 12px; height: 12px; border-radius: 50%; background: #fff; border: 2px solid #c7d2fe; } .dstimeline-item--active .dstimeline-dot { background: linear-gradient(135deg,#4f46e5,#3b82f6); border-color: transparent; animation: dstimelineDotPulse 2s ease-in-out infinite; } @keyframes dstimelineDotPulse { 0%, 100% { box-shadow: 0 0 0 4px #eef2ff; } 50% { box-shadow: 0 0 0 8px rgba(79,70,229,.12); } } .dstimeline-date { display: inline-block; font-size: .7rem; font-weight: 700; color: #4f46e5; background: #eef2ff; padding: 2px 10px; border-radius: 100px; margin-bottom: 6px; } .dstimeline-content h4 { margin: 0 0 4px; font-size: .92rem; color: #1e293b; } .dstimeline-content p { margin: 0; color: #6b7280; font-size: .82rem; line-height: 1.5; }',
      html: '<ol class="dstimeline"><li class="dstimeline-item"><span class="dstimeline-dot"></span><div class="dstimeline-content"><span class="dstimeline-date">2023</span><h4>Uzņēmums dibināts</h4><p>Sākām ar 3 cilvēku komandu un vienu ideju.</p></div></li><li class="dstimeline-item"><span class="dstimeline-dot"></span><div class="dstimeline-content"><span class="dstimeline-date">2024</span><h4>Pirmie 1000 klienti</h4><p>Produkts sasniedza tirgus atbilstību un sāka augt organiski.</p></div></li><li class="dstimeline-item dstimeline-item--active"><span class="dstimeline-dot"></span><div class="dstimeline-content"><span class="dstimeline-date">2026</span><h4>Starptautiska paplašināšanās</h4><p>Šobrīd strādājam pie ienākšanas jaunos tirgos.</p></div></li></ol>',
      js: "(function(){var items=document.querySelectorAll('.dstimeline-item');var observer=new IntersectionObserver(function(entries){entries.forEach(function(entry){if(entry.isIntersecting){entry.target.classList.add('visible');observer.unobserve(entry.target);}});},{threshold:0.3});Array.prototype.forEach.call(items,function(item,i){item.style.transitionDelay=(i*0.1)+'s';observer.observe(item);});})();"
    },
    'preview-imgcompare': {

      html: '<div class="dsimgcompare" id="dsimgcompare1"><img class="dsimgcompare-layer dsimgcompare-after" src="' + img6 + '" alt="Attēls pēc"><img class="dsimgcompare-layer dsimgcompare-before" src="' + img2 + '" alt="Attēls pirms" id="dsimgcompareBefore"><div class="dsimgcompare-divider" id="dsimgcompareDivider"><span class="dsimgcompare-handle">↔</span></div><span class="dsimgcompare-label dsimgcompare-label--before">Pirms</span><span class="dsimgcompare-label dsimgcompare-label--after">Pēc</span></div>',
      js: "(function(){var container=document.getElementById('dsimgcompare1');var before=document.getElementById('dsimgcompareBefore');var divider=document.getElementById('dsimgcompareDivider');var dragging=false;function setPosition(clientX){var rect=container.getBoundingClientRect();var percent=((clientX-rect.left)/rect.width)*100;percent=Math.max(0,Math.min(100,percent));before.style.clipPath='inset(0 '+(100-percent)+'% 0 0)';divider.style.left=percent+'%';}container.addEventListener('pointerdown',function(e){dragging=true;setPosition(e.clientX);});window.addEventListener('pointermove',function(e){if(dragging)setPosition(e.clientX);});window.addEventListener('pointerup',function(){dragging=false;});})();"

    'preview-btngallery': {
      css: '.dsbtngallery { display: flex; flex-wrap: wrap; gap: 10px; padding: 22px; border-radius: 18px; background: linear-gradient(135deg,#eef2ff,#f5f3ff); } .dsbtn-demo { padding: 10px 18px; border-radius: 9px; font-weight: 600; font-size: .78rem; cursor: pointer; border: none; font-family: inherit; } .dsbtn-primary { background: linear-gradient(135deg,#4f46e5,#3b82f6); color: #fff; box-shadow: 0 10px 24px -10px rgba(79,70,229,.6); transition: transform .2s ease, box-shadow .2s ease; } .dsbtn-primary:hover { transform: translateY(-3px); box-shadow: 0 14px 30px -10px rgba(79,70,229,.7); } .dsbtn-outline { background: transparent; color: #4f46e5; border: 2px solid #4f46e5; padding: 8px 16px; transition: background .25s ease, color .25s ease; } .dsbtn-outline:hover { background: #4f46e5; color: #fff; } .dsbtn-ghost { background: none; color: #1e293b; position: relative; } .dsbtn-ghost::after { content: ""; position: absolute; left: 18px; right: 18px; bottom: 6px; height: 2px; background: linear-gradient(90deg,#4f46e5,#3b82f6); transform: scaleX(0); transform-origin: left; transition: transform .3s ease; } .dsbtn-ghost:hover::after { transform: scaleX(1); } .dsbtn-success { background: #059669; color: #fff; position: relative; overflow: hidden; } .dsbtn-ripple { position: absolute; border-radius: 50%; width: 10px; height: 10px; margin: -5px 0 0 -5px; background: rgba(255,255,255,.6); animation: dsbtnRipple .6s ease-out; pointer-events: none; } @keyframes dsbtnRipple { to { transform: scale(12); opacity: 0; } } .dsbtn-danger { background: #dc2626; color: #fff; } .dsbtn-danger:hover { animation: dsbtnShake .5s ease; } @keyframes dsbtnShake { 10%, 90% { transform: translateX(-1px); } 20%, 80% { transform: translateX(2px); } 30%, 50%, 70% { transform: translateX(-4px); } 40%, 60% { transform: translateX(4px); } } .dsbtn-glass { background: rgba(255,255,255,.5); backdrop-filter: blur(12px) saturate(180%); border: 1px solid rgba(255,255,255,.7); color: #1e293b; box-shadow: 0 8px 24px -12px rgba(49,46,129,.25); transition: background .2s ease; } .dsbtn-glass:hover { background: rgba(255,255,255,.75); } .dsbtn-shine { background: #111827; color: #fff; position: relative; overflow: hidden; } .dsbtn-shine::before { content: ""; position: absolute; top: 0; left: -75%; width: 50%; height: 100%; background: linear-gradient(120deg, transparent, rgba(255,255,255,.4), transparent); transform: skewX(-20deg); transition: left .6s ease; } .dsbtn-shine:hover::before { left: 125%; } .dsbtn-3d { background: #4f46e5; color: #fff; box-shadow: 0 6px 0 #3730a3; transition: transform .1s ease, box-shadow .1s ease; } .dsbtn-3d:active { transform: translateY(6px); box-shadow: 0 0 0 #3730a3; } .dsbtn-loading { background: #4f46e5; color: #fff; position: relative; min-width: 100px; transition: background .2s ease; } .dsbtn-loading .dsbtn-label { transition: opacity .2s ease; } .dsbtn-loading.is-loading .dsbtn-label { opacity: 0; } .dsbtn-loading-spinner { position: absolute; top: 50%; left: 50%; width: 16px; height: 16px; margin: -8px 0 0 -8px; border: 2px solid rgba(255,255,255,.4); border-top-color: #fff; border-radius: 50%; opacity: 0; animation: dsbtnSpin .6s linear infinite; } .dsbtn-loading.is-loading .dsbtn-loading-spinner { opacity: 1; } @keyframes dsbtnSpin { to { transform: rotate(360deg); } } .dsbtn-loading.is-done { background: #059669; } .dsbtn-gborder { background: linear-gradient(#fff,#fff) padding-box, linear-gradient(135deg,#4f46e5,#3b82f6) border-box; border: 2px solid transparent; color: #4f46e5; transition: color .25s ease, background .25s ease; } .dsbtn-gborder:hover { background: linear-gradient(135deg,#4f46e5,#3b82f6) padding-box, linear-gradient(135deg,#4f46e5,#3b82f6) border-box; color: #fff; } .dsbtn-modal { display: none; position: fixed; inset: 0; background: rgba(17,24,39,.5); backdrop-filter: blur(16px) saturate(160%); align-items: center; justify-content: center; z-index: 999; padding: 20px; box-sizing: border-box; } .dsbtn-modal.open { display: flex; } .dsbtn-modal-box { background: rgba(255,255,255,.85); backdrop-filter: blur(24px) saturate(180%); border: 1px solid rgba(255,255,255,.6); border-radius: 20px; padding: 22px; max-width: 420px; width: 100%; position: relative; box-shadow: 0 30px 70px -25px rgba(49,46,129,.45); animation: dsbtnModalPop .3s cubic-bezier(.34,1.56,.64,1); box-sizing: border-box; } @keyframes dsbtnModalPop { from { opacity: 0; transform: scale(.92) translateY(10px); } to { opacity: 1; transform: scale(1) translateY(0); } } .dsbtn-modal-close { position: absolute; top: 14px; right: 14px; background: #f3f4f6; border: none; width: 26px; height: 26px; border-radius: 50%; cursor: pointer; color: #6b7280; } .dsbtn-modal-close:hover { background: #e5e7eb; } .dsbtn-modal-box h3 { margin: 0 0 12px; font-size: .95rem; color: #1e293b; padding-right: 28px; } .dsbtn-modal-code { background: #111827; color: #e5e7eb; border-radius: 10px; padding: 14px; font-size: .7rem; line-height: 1.55; overflow: auto; max-height: 220px; margin: 0 0 12px; white-space: pre; font-family: "Courier New", monospace; } .dsbtn-modal-copy { background: linear-gradient(135deg,#4f46e5,#3b82f6); color: #fff; border: none; padding: 8px 16px; border-radius: 9px; font-weight: 600; font-size: .78rem; cursor: pointer; transition: background .2s ease; } .dsbtn-modal-copy.copied { background: #059669; }',
      html: '<div class="dsbtngallery"><button type="button" class="dsbtn-demo dsbtn-primary" data-btn="primary">Primārā</button><button type="button" class="dsbtn-demo dsbtn-outline" data-btn="outline">Kontūras</button><button type="button" class="dsbtn-demo dsbtn-ghost" data-btn="ghost">Ghost</button><button type="button" class="dsbtn-demo dsbtn-success" data-btn="success">Veiksmes</button><button type="button" class="dsbtn-demo dsbtn-danger" data-btn="danger">Bīstama</button><button type="button" class="dsbtn-demo dsbtn-glass" data-btn="glass">Stikla</button><button type="button" class="dsbtn-demo dsbtn-shine" data-btn="shine">Shine</button><button type="button" class="dsbtn-demo dsbtn-3d" data-btn="press">3D</button><button type="button" class="dsbtn-demo dsbtn-loading" data-btn="loading"><span class="dsbtn-label">Ielāde</span><span class="dsbtn-loading-spinner"></span></button><button type="button" class="dsbtn-demo dsbtn-gborder" data-btn="gborder">Gradients</button></div><div class="dsbtn-modal" id="dsbtnModal"><div class="dsbtn-modal-box"><button type="button" class="dsbtn-modal-close" id="dsbtnModalClose" aria-label="Aizvērt">✕</button><h3 id="dsbtnModalTitle">Pogas kods</h3><pre class="dsbtn-modal-code"><code id="dsbtnModalCode"></code></pre><button type="button" class="dsbtn-modal-copy" id="dsbtnModalCopy">Kopēt kodu</button></div></div>',
      js: "(function(){\nvar buttons = document.querySelectorAll('.dsbtn-demo');\nvar modal = document.getElementById('dsbtnModal');\nvar modalTitle = document.getElementById('dsbtnModalTitle');\nvar modalCode = document.getElementById('dsbtnModalCode');\nvar modalClose = document.getElementById('dsbtnModalClose');\nvar modalCopy = document.getElementById('dsbtnModalCopy');\n\nvar snippets = {\n  primary: { title: \"Primārā poga (gradients + pacēlums)\", code: \"<button class=\\\"dsbtn-primary\\\">Primārā</button>\\n\\n.dsbtn-primary {\\n  background: linear-gradient(135deg,#4f46e5,#3b82f6);\\n  color: #fff;\\n  box-shadow: 0 10px 24px -10px rgba(79,70,229,.6);\\n  transition: transform .2s ease, box-shadow .2s ease;\\n}\\n.dsbtn-primary:hover {\\n  transform: translateY(-3px);\\n  box-shadow: 0 14px 30px -10px rgba(79,70,229,.7);\\n}\" },\n  outline: { title: \"Kontūras poga\", code: \"<button class=\\\"dsbtn-outline\\\">Kontūras</button>\\n\\n.dsbtn-outline {\\n  background: transparent;\\n  color: #4f46e5;\\n  border: 2px solid #4f46e5;\\n  transition: background .25s ease, color .25s ease;\\n}\\n.dsbtn-outline:hover {\\n  background: #4f46e5;\\n  color: #fff;\\n}\" },\n  ghost: { title: \"Ghost poga (izslīdošs pasvītrojums)\", code: \"<button class=\\\"dsbtn-ghost\\\">Ghost</button>\\n\\n.dsbtn-ghost {\\n  background: none;\\n  color: #1e293b;\\n  position: relative;\\n}\\n.dsbtn-ghost::after {\\n  content: \\\"\\\";\\n  position: absolute;\\n  left: 22px; right: 22px; bottom: 8px;\\n  height: 2px;\\n  background: linear-gradient(90deg,#4f46e5,#3b82f6);\\n  transform: scaleX(0);\\n  transform-origin: left;\\n  transition: transform .3s ease;\\n}\\n.dsbtn-ghost:hover::after {\\n  transform: scaleX(1);\\n}\" },\n  success: { title: \"Veiksmes poga (ripple no klikšķa punkta)\", code: \"<button class=\\\"dsbtn-success\\\">Veiksmes</button>\\n\\n.dsbtn-success {\\n  background: #059669;\\n  color: #fff;\\n  position: relative;\\n  overflow: hidden;\\n}\\n.dsbtn-ripple {\\n  position: absolute;\\n  border-radius: 50%;\\n  width: 10px; height: 10px;\\n  margin: -5px 0 0 -5px;\\n  background: rgba(255,255,255,.6);\\n  animation: dsbtnRipple .6s ease-out;\\n  pointer-events: none;\\n}\\n@keyframes dsbtnRipple {\\n  to { transform: scale(12); opacity: 0; }\\n}\\n\\n// JS\\nbtn.addEventListener(\\\"click\\\", (e) => {\\n  const rect = btn.getBoundingClientRect();\\n  const ripple = document.createElement(\\\"span\\\");\\n  ripple.className = \\\"dsbtn-ripple\\\";\\n  ripple.style.left = (e.clientX - rect.left) + \\\"px\\\";\\n  ripple.style.top = (e.clientY - rect.top) + \\\"px\\\";\\n  btn.appendChild(ripple);\\n  ripple.addEventListener(\\\"animationend\\\", () => ripple.remove());\\n});\" },\n  danger: { title: \"Bīstama poga (trīce uz hover)\", code: \"<button class=\\\"dsbtn-danger\\\">Bīstama</button>\\n\\n.dsbtn-danger {\\n  background: #dc2626;\\n  color: #fff;\\n}\\n.dsbtn-danger:hover {\\n  animation: dsbtnShake .5s ease;\\n}\\n@keyframes dsbtnShake {\\n  10%, 90% { transform: translateX(-1px); }\\n  20%, 80% { transform: translateX(2px); }\\n  30%, 50%, 70% { transform: translateX(-4px); }\\n  40%, 60% { transform: translateX(4px); }\\n}\" },\n  glass: { title: \"Stikla poga (glassmorphism)\", code: \"<button class=\\\"dsbtn-glass\\\">Stikla</button>\\n\\n.dsbtn-glass {\\n  background: rgba(255,255,255,.5);\\n  backdrop-filter: blur(12px) saturate(180%);\\n  border: 1px solid rgba(255,255,255,.7);\\n  color: #1e293b;\\n}\" },\n  shine: { title: \"Shine poga (spīduma josla)\", code: \"<button class=\\\"dsbtn-shine\\\">Shine</button>\\n\\n.dsbtn-shine {\\n  background: #111827;\\n  color: #fff;\\n  position: relative;\\n  overflow: hidden;\\n}\\n.dsbtn-shine::before {\\n  content: \\\"\\\";\\n  position: absolute;\\n  top: 0; left: -75%;\\n  width: 50%; height: 100%;\\n  background: linear-gradient(120deg, transparent, rgba(255,255,255,.4), transparent);\\n  transform: skewX(-20deg);\\n  transition: left .6s ease;\\n}\\n.dsbtn-shine:hover::before {\\n  left: 125%;\\n}\" },\n  press: { title: \"3D poga (nospiešanas efekts)\", code: \"<button class=\\\"dsbtn-3d\\\">3D</button>\\n\\n.dsbtn-3d {\\n  background: #4f46e5;\\n  color: #fff;\\n  box-shadow: 0 6px 0 #3730a3;\\n  transition: transform .1s ease, box-shadow .1s ease;\\n}\\n.dsbtn-3d:active {\\n  transform: translateY(6px);\\n  box-shadow: 0 0 0 #3730a3;\\n}\" },\n  loading: { title: \"Ielādes poga (async stāvoklis)\", code: \"<button class=\\\"dsbtn-loading\\\">\\n  <span class=\\\"dsbtn-label\\\">Ielāde</span>\\n  <span class=\\\"dsbtn-loading-spinner\\\"></span>\\n</button>\\n\\n// JS\\nbtn.addEventListener(\\\"click\\\", () => {\\n  btn.classList.add(\\\"is-loading\\\");\\n  btn.disabled = true;\\n  setTimeout(() => {\\n    btn.classList.remove(\\\"is-loading\\\");\\n    btn.classList.add(\\\"is-done\\\");\\n    setTimeout(() => btn.classList.remove(\\\"is-done\\\"), 1200);\\n    btn.disabled = false;\\n  }, 1500);\\n});\" },\n  gborder: { title: \"Gradienta robeža\", code: \"<button class=\\\"dsbtn-gborder\\\">Gradients</button>\\n\\n.dsbtn-gborder {\\n  background: linear-gradient(#fff,#fff) padding-box,\\n              linear-gradient(135deg,#4f46e5,#3b82f6) border-box;\\n  border: 2px solid transparent;\\n  color: #4f46e5;\\n}\\n.dsbtn-gborder:hover {\\n  background: linear-gradient(135deg,#4f46e5,#3b82f6) padding-box,\\n              linear-gradient(135deg,#4f46e5,#3b82f6) border-box;\\n  color: #fff;\\n}\" },\n};\n\nfunction copyText(text) {\n  if (navigator.clipboard && navigator.clipboard.writeText) {\n    return navigator.clipboard.writeText(text).catch(fallbackCopy);\n  }\n  return fallbackCopy();\n  function fallbackCopy() {\n    var ta = document.createElement('textarea');\n    ta.value = text;\n    ta.style.position = 'fixed';\n    ta.style.opacity = '0';\n    document.body.appendChild(ta);\n    ta.select();\n    try { document.execCommand('copy'); } catch (err) {}\n    document.body.removeChild(ta);\n  }\n}\n\nArray.prototype.forEach.call(buttons, function (btn) {\n  btn.addEventListener('click', function (e) {\n    var snip = snippets[btn.dataset.btn];\n    if (snip) {\n      modalTitle.textContent = snip.title;\n      modalCode.textContent = snip.code;\n      modal.classList.add('open');\n    }\n\n    if (btn.classList.contains('dsbtn-success')) {\n      var rect = btn.getBoundingClientRect();\n      var ripple = document.createElement('span');\n      ripple.className = 'dsbtn-ripple';\n      ripple.style.left = (e.clientX - rect.left) + 'px';\n      ripple.style.top = (e.clientY - rect.top) + 'px';\n      btn.appendChild(ripple);\n      ripple.addEventListener('animationend', function () { ripple.remove(); });\n    }\n\n    if (btn.classList.contains('dsbtn-loading') && !btn.classList.contains('is-loading')) {\n      btn.classList.add('is-loading');\n      btn.disabled = true;\n      setTimeout(function () {\n        btn.classList.remove('is-loading');\n        btn.classList.add('is-done');\n        setTimeout(function () { btn.classList.remove('is-done'); }, 1200);\n        btn.disabled = false;\n      }, 1500);\n    }\n  });\n});\n\nmodalClose.addEventListener('click', function () { modal.classList.remove('open'); });\nmodal.addEventListener('click', function (e) {\n  if (e.target === modal) modal.classList.remove('open');\n});\ndocument.addEventListener('keydown', function (e) {\n  if (e.key === 'Escape') modal.classList.remove('open');\n});\n\nmodalCopy.addEventListener('click', function () {\n  copyText(modalCode.textContent);\n  modalCopy.textContent = 'Nokopēts!';\n  modalCopy.classList.add('copied');\n  setTimeout(function () {\n    modalCopy.textContent = 'Kopēt kodu';\n    modalCopy.classList.remove('copied');\n  }, 1500);\n});\n})();"
    }
  };

  Object.keys(demos).forEach(function (id) {
    var frame = document.getElementById(id);
    if (!frame) return;
    var d = demos[id];
    frame.srcdoc = wrapDoc(d.css, d.html, d.js);
  });
})();
