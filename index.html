<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png" />
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#0f8a4d" />
<title>Documentation Samis - Dokumentācijas centrs</title>
<meta name="description" content="Personīgas piezīmes par WordPress, JavaScript, PHP un web izveidi." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=139" />
<script>
  (function(){var t=localStorage.getItem("docsamis-theme")||(matchMedia("(prefers-color-scheme: light)").matches?"light":"dark");document.documentElement.setAttribute("data-theme",t);})();
</script>
</head>
<body class="has-global-nav">
<div id="global-nav-root"></div>

<main class="global-main">
  <section class="hero">
    <div class="hero-kicker">zināšanu bāze &amp; ceļveži</div>
    <h1>Samantas dokumentācija</h1>
    <p>Lapas kreisajā joslā - meklēšana pieejama tur pat.</p>

    <div class="term-window" id="home-term" style="max-width:480px; margin-top:28px; cursor:text;">
      <div class="term-window-header">
        <span class="term-window-dots"></span>
        <span class="term-window-title">~/dokumentacija</span>
      </div>
      <div class="term-window-body">
        <div id="term-output" style="font-family:var(--font-mono); font-size:13px; color:var(--text-secondary); line-height:1.7;">
          <p style="margin:0;">Ieraksti <code>ls</code>, <code>cd &lt;sadaļa&gt;</code> vai <code>help</code>.</p>
        </div>
        <div style="display:flex; align-items:center; gap:6px; margin-top:10px; font-family:var(--font-mono); font-size:13px;">
          <span style="color:var(--accent); font-weight:700;">$</span>
          <input id="term-input" type="text" autocomplete="off" spellcheck="false" style="flex:1; min-width:0; background:transparent; border:none; outline:none; color:var(--text); font-family:var(--font-mono); font-size:13px;" placeholder="ls">
        </div>
      </div>
    </div>
  </section>

  <script>
    (function () {
      var CATS = {
        laravel: "pages/laravel.html",
        tikls: "pages/web-izveide.html",
        riki: "pages/riki.html"
      };
      var win = document.getElementById("home-term");
      var out = document.getElementById("term-output");
      var input = document.getElementById("term-input");
      if (!win || !out || !input) return;

      function line(html) {
        var p = document.createElement("p");
        p.style.margin = "6px 0 0";
        p.innerHTML = html;
        out.appendChild(p);
        win.scrollTop = win.scrollHeight;
      }

      function lsLine() {
        return Object.keys(CATS).map(function (name) {
          return '<a href="' + CATS[name] + '" style="color:var(--accent); text-decoration:underline;">' + name + '/</a>';
        }).join("&nbsp;&nbsp;");
      }

      function run(cmd) {
        var parts = cmd.trim().split(/\s+/);
        var name = (parts[0] || "").toLowerCase();
        line('<span style="color:var(--text-muted);">$</span> ' + (cmd || "&nbsp;"));

        if (name === "") return;
        if (name === "ls") { line(lsLine()); return; }
        if (name === "help") {
          line("<code>ls</code> - saraksts &nbsp; <code>cd &lt;sadaļa&gt;</code> - atvērt &nbsp; <code>clear</code> - notīrīt");
          return;
        }
        if (name === "clear") { out.innerHTML = ""; return; }
        if (name === "cd") {
          var target = (parts[1] || "").toLowerCase();
          if (CATS[target]) { window.location.href = CATS[target]; return; }
          line('nav sadaļas: <strong>' + (parts[1] || "") + '</strong>');
          return;
        }
        line('komanda nav atrasta: <strong>' + name + '</strong> - ieraksti <code>help</code>');
      }

      input.addEventListener("keydown", function (e) {
        if (e.key !== "Enter") return;
        var val = input.value;
        input.value = "";
        run(val);
      });

      win.addEventListener("click", function () { input.focus(); });
    })();
  </script>
</main>
